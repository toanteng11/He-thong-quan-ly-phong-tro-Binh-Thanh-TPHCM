<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <!-- Định nghĩa màu sắc -->
  <defs>
    <linearGradient id="gradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- CỤM BIỂU TƯỢNG (ICON) -->
  <g transform="translate(40, 35)">
    <!-- Mái nhà trái (Xanh Navy) -->
    <polygon points="90,5 5,75 22,93 90,37" fill="url(#gradNavy)" />
    <!-- Mái nhà phải (Vàng Gold) -->
    <polygon points="90,5 175,75 158,93 90,37" fill="url(#gradGold)" />
    
    <!-- Viên Ngọc (Diamond) -->
    <polygon points="90,40 106,53 90,68 74,53" fill="url(#gradGold)" />
    
    <!-- Chữ N (Xanh Navy) -->
    <path d="M 20 75 L 42 75 L 68 115 L 68 75 L 86 75 L 86 160 L 64 160 L 38 120 L 38 160 L 20 160 Z" fill="url(#gradNavy)" />
    
    <!-- Chữ T (Vàng Gold) -->
    <path d="M 98 75 L 160 75 L 160 95 L 138 95 L 138 160 L 120 160 L 120 95 L 98 95 Z" fill="url(#gradGold)" />
  </g>

  <!-- CỤM CHỮ (TYPOGRAPHY) -->
  <!-- Tên Thương hiệu -->
  <text x="250" y="120" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="80" fill="#1E3A8A" letter-spacing="1">NGỌC TOÀN</text>
  
  <!-- Slogan / Dịch vụ -->
  <text x="255" y="165" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#555555" letter-spacing="1.5">HỆ THỐNG PHÒNG TRỌ BÌNH THẠNH</text>
</svg>